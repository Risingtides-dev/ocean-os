# License selection for the macOS arm64 Ocean binary distribution.
# Keep this aligned with deny.toml; cargo-about fails closed on an unaccepted or
# unresolved license instead of silently omitting it from the shipped inventory.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }
workarounds = ["ring", "rustls"]
