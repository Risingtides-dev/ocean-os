[package]
name = "ocean-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# The capability seam we implement. ocean-mcp depends UP into ocean-runtime;
# ocean-runtime must never depend back on ocean-mcp.
ocean-runtime = { path = "../ocean-runtime" }
# Shared content model. A tool result's `content` is `Vec<Content>`, so the MCP
# client builds `Content::Image` blocks for non-text MCP results directly.
ocean-protocol = { path = "../ocean-protocol" }

anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# Streamable-HTTP MCP transport (OCEAN-166). `reqwest` drives the POST/GET
# round-trips; `futures-util` + `eventsource-stream` parse the `text/event-stream`
# responses the spec lets a server return for any request. Same HTTP stack the
# protocol crate already uses, so no new transitive surface for the workspace.
reqwest.workspace = true
futures-util = "0.3"
eventsource-stream = "0.2"

# A tiny in-repo stdio MCP server lives at src/bin/fake_server.rs (auto-
# discovered). Cargo builds it for tests and sets CARGO_BIN_EXE_fake_server, the
# path the e2e test spawns as the MCP child. It uses serde_json (a normal dep).
[[bin]]
name = "fake_server"
test = false
doc = false

[dev-dependencies]
# Parses the [[mcp.server]] section in the config test; the daemon's real
# loader (ocean-agent) carries the non-dev toml dependency.
toml.workspace = true
