[package]
name = "ocean-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
ocean-agent-sdk.workspace = true
ocean-core.workspace = true
ratatui = "0.29"
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# Phase-1 shell (session-first rebuild): async component architecture.
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = "0.3"
# Phase-2 shell: embedded PTY for resuming ocean sessions (harvested from CTRL).
portable-pty = "0.8"
vt100 = "0.15"
tui-term = "0.2"
# Phase-3 shell: editor / file tree / graph workbench surfaces (harvested from CTRL).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4"
