[package]
name = "ocean-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The `runtime` feature pulls in `ocean-runtime` and exposes `PluginProvider`,
# the adapter that surfaces a plugin's tools through the runtime's
# `CapabilityProvider` seam (alongside built-ins and MCP). On by default so the
# daemon gets it without extra config; a consumer that only wants the plugin
# transport can disable default features and pay nothing for the runtime dep.
default = ["runtime"]
runtime = ["dep:ocean-runtime", "dep:ocean-protocol"]

[dependencies]
# Plugin tools and arguments are JSON values; manifests are TOML. The runtime
# (tokio) and stdio process plumbing mirror ocean-mcp's proven transport so a
# plugin subprocess is driven exactly like an MCP server child.
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

# Optional, behind the `runtime` feature: the capability seam this crate's
# `PluginProvider` implements. ocean-plugin depends UP into ocean-runtime, like
# ocean-mcp; ocean-runtime must never depend back. ocean-protocol provides the
# `Content` model a tool result is built from.
ocean-runtime = { path = "../ocean-runtime", optional = true }
ocean-protocol = { path = "../ocean-protocol", optional = true }

# A tiny in-repo stdio plugin lives at src/bin/echo_plugin.rs (auto-discovered).
# Cargo builds it for tests and sets CARGO_BIN_EXE_echo_plugin, the path the
# round-trip test spawns as the plugin child. It uses serde_json (a normal dep).
[[bin]]
name = "echo_plugin"
test = false
doc = false

# The runnable example plugin (`reverse_text` + `current_time`). Its source lives
# inside the example plugin *pack* directory alongside its plugin.toml, so the
# pack is a self-contained, copy-and-go unit. Built with
# `cargo build --example ocean-example-plugin`; the example_loads_through_runtime
# integration test resolves the built binary under target/<profile>/examples/.
[[example]]
name = "ocean-example-plugin"
path = "examples/example_plugin/main.rs"
doc = false
