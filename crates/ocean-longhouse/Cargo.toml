[package]
name = "ocean-longhouse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Event vocabulary shared with the daemon + deck. The QuorumEngine produces
# the SAME LonghouseEvent / Mark / Federation / AgentRole types the deck
# already renders — we never invent a new event shape.
ocean-agent-sdk = { path = "../ocean-agent-sdk" }
# Shared protocol primitives. We reuse the OCEAN-185 unforgeable-token primitive
# (`mint_decision_token` / `decision_token_matches`, constant-time) to make the
# firekeeper's right to `claim_outcome` unforgeable — the same trust-boundary
# discipline as permission decision tokens. ocean-core depends only on
# chrono/serde/uuid, so there is no dependency cycle.
ocean-core = { path = "../ocean-core" }
# LLM calls go through the existing unified provider protocol (stream_simple),
# never a hand-rolled HTTP client.
ocean-protocol = { path = "../ocean-protocol" }
# Credential + model-alias resolution (deepseek / kimi keys from auth.json).
ocean-providers = { path = "../ocean-providers" }
# The CapabilityProvider / AgentTool seam, so the council ops can be exposed to
# agents as tools (LonghouseProvider). We depend UP on ocean-runtime; it never
# depends back on us, so there is no cycle — same posture as ocean-mcp.
ocean-runtime = { path = "../ocean-runtime" }

anyhow.workspace = true
async-trait.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
axum.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
# Recursive directory scan for the skill index loader (prepare.rs). Already in
# the dependency tree transitively; pinned here as a direct, intentional dep.
walkdir = "2"
# Durable storage for the escrow trio's persisted TitleRegistry (OCEAN-246).
# Same `rusqlite` (bundled) backend, sync + Mutex-guardable, hermetic (no system
# libsqlite3) as `ocean-store`'s SqliteRoomStore — we mirror that pattern rather
# than introduce a second DB convention.
rusqlite = { workspace = true }
# SHA-256 for the persistence-safe title *verifier* (salt + hash), so the secret
# proof-of-title token is NEVER stored — only `SHA-256(salt||token)`, like
# password storage. Already in the workspace lockfile (5+ transitive users);
# pinned here as a direct, intentional dep.
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
