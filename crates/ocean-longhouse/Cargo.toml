[package]
name = "ocean-longhouse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Event vocabulary shared with the daemon + deck. The QuorumEngine produces
# the SAME LonghouseEvent / Mark / Federation / AgentRole types the deck
# already renders — we never invent a new event shape.
ocean-agent-sdk = { path = "../ocean-agent-sdk" }
# LLM calls go through the existing unified provider protocol (stream_simple),
# never a hand-rolled HTTP client.
ocean-protocol = { path = "../ocean-protocol" }
# Credential + model-alias resolution (deepseek / kimi keys from auth.json).
ocean-providers = { path = "../ocean-providers" }
# The CapabilityProvider / AgentTool seam, so the council ops can be exposed to
# agents as tools (LonghouseProvider). We depend UP on ocean-runtime; it never
# depends back on us, so there is no cycle — same posture as ocean-mcp.
ocean-runtime = { path = "../ocean-runtime" }

anyhow.workspace = true
async-trait.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
axum.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true }
