[package]
name = "ocean-ast"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Read-time structural code summarization (function/body folding) powered by tree-sitter. Ported mechanism from oh-my-pi's pi-ast (MIT)."

[dependencies]
# Core tree-sitter is pinned workspace-wide (=0.26.9) alongside the two grammar
# crates ocean-context already resolves. The remaining grammars are pinned here
# to versions whose tree-sitter-language ABI coexists with 0.26.9.
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-javascript = "0.25"
