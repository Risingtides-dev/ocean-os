[package]
name = "ocean-browser"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }
description = "Legacy Chrome DevTools Protocol backend (default-off); being replaced by the OceanWebKit browser host."

[features]
default = []
# The entire crate is the legacy chromiumoxide/CDP backend. With this feature
# off (the default) the crate compiles to an inert stub and no chromiumoxide
# enters the build graph. Enable through a consumer
# (`ocean-daemon --features legacy-chromium`), never directly in production.
legacy-chromium = ["dep:chromiumoxide"]

[dependencies]
chromiumoxide = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = "1"
tracing = { workspace = true }

[dev-dependencies]
libc = "0.2"
tokio = { workspace = true }
