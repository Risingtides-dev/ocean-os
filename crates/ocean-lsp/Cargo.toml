[package]
name = "ocean-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The capability seam we implement. ocean-lsp depends UP into ocean-runtime;
# ocean-runtime must never depend back on ocean-lsp (same rule as ocean-mcp).
ocean-runtime = { path = "../ocean-runtime" }

anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# A tiny in-repo stdio LSP server lives at src/bin/fake_lsp.rs (auto-
# discovered). Cargo builds it for tests and sets CARGO_BIN_EXE_fake_lsp, the
# path the e2e test spawns as the language-server child — deterministic tests
# with no rust-analyzer/tsserver on the box.
[[bin]]
name = "fake_lsp"
test = false
doc = false
