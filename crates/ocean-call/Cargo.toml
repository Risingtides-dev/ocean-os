[package]
name = "ocean-call"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Daemon-side PSTN call-intelligence service: Twilio SIP → LiveKit room →
# server-side audio tap → streaming STT → rolling summary + task detection,
# plus a wake-word-gated active voice lane. See
# docs/superpowers/specs/2026-06-05-ocean-call-intelligence-design.md.

[dependencies]
ocean-core = { path = "../ocean-core" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true

# LiveKit server SDK: SIPClient for outbound dial (create_sip_participant) and
# trunk/dispatch provisioning. Verified against livekit-api 0.5.0 source. The
# `room_tap` audio subscribe uses the `livekit` client crate (0.7.44) — added
# when that adapter lands so the pure logic stays buildable without native deps.
livekit-api = { version = "0.5", default-features = false, features = ["services-tokio", "access-token", "webhooks", "native-tls"] }
livekit-protocol = "0.5"

# Heavy native libwebrtc client, only for the live room_tap. Opt-in via the
# `livekit-tap` feature so the logic core compiles fast without it.
livekit = { version = "0.7.44", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = []
# Enables room_tap::live — the real LiveKit room connect + audio subscribe.
# Pulls native WebRTC; build with: cargo build -p ocean-call --features livekit-tap
livekit-tap = ["dep:livekit", "dep:futures-util"]
# Enables stt_xai::live — the real HTTP transcription call (needs reqwest
# multipart + a runtime XAI key). The request-building logic is always built.
xai-stt = ["reqwest/multipart"]
# Enables tts_xai::live — the real xAI TTS HTTP call that renders Ocean's reply
# to 16kHz mono PCM for the active lane. The `TtsSynth` trait it implements lives
# in `session_task::live`, which is `livekit-tap`-gated, so this implies it. The
# decode/resample/request-shaping logic in `tts_xai` is always built and tested
# without this feature, a network call, or an xAI key.
xai-tts = ["livekit-tap"]
