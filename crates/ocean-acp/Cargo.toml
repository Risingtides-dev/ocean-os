[package]
name = "ocean-acp"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
description = "ACP (Agent Client Protocol) bridge — exposes the Ocean daemon to Zed and other ACP editors over stdio."

[[bin]]
name = "ocean-acp"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.13"
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
clap = { workspace = true }
futures = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# The daemon wire types (AgentTurnRequest/Response/Event) live in ocean-agent-sdk;
# reuse them directly so the bridge never drifts from the daemon contract.
ocean-agent-sdk = { workspace = true }
# Control-plane wire types: the legacy /v1/events envelope + permission
# decision request/decision enums, reused so the bridge never drifts.
ocean-core = { workspace = true }

[dev-dependencies]
# A mock gated daemon for the OCEAN-146 integration proof: reproduces the real
# broadcast-channel timing of `/v1/events` and the block-until-decision
# behaviour of `/v1/agent/turns`, so we can prove the bridge subscribes BEFORE
# the turn can block — no live LLM provider required.
axum = { workspace = true }
tokio-stream = { workspace = true }
