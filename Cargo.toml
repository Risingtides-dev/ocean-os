[workspace]
members = [
  "crates/ocean-core",
  "crates/ocean-protocol",
  "crates/ocean-runtime",
  "crates/ocean-mcp",
  "crates/ocean-acp",
  "crates/ocean-agent",
  "crates/ocean-agent-sdk",
  "crates/ocean-providers",
  "crates/ocean-longhouse",
  "crates/ocean-heartbeat",
  "crates/ocean-daemon",
  "crates/ocean-cli",
  "crates/ocean-tui",
  "crates/ocean-browser",
  "crates/ocean-heartbeat",
  "crates/ocean-call",
  "crates/ocean-store",
  "crates/ocean-plugin",
  "xtask",
]
# xtask is a dev-only task runner (the cargo-xtask pattern). It compiles under
# `cargo build --workspace`, but a bare `cargo build` / `cargo test` skips it via
# default-members so day-to-day builds don't pay for it. Invoke it explicitly:
#   cargo xtask <cmd>        (alias in /.cargo/config.toml)
#   cargo run -p xtask -- <cmd>
default-members = [
  "crates/ocean-core",
  "crates/ocean-protocol",
  "crates/ocean-runtime",
  "crates/ocean-mcp",
  "crates/ocean-acp",
  "crates/ocean-agent",
  "crates/ocean-agent-sdk",
  "crates/ocean-providers",
  "crates/ocean-longhouse",
  "crates/ocean-heartbeat",
  "crates/ocean-daemon",
  "crates/ocean-cli",
  "crates/ocean-tui",
  "crates/ocean-browser",
  "crates/ocean-call",
  "crates/ocean-store",
  "crates/ocean-plugin",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Ocean OS"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ocean-core = { path = "crates/ocean-core" }
ocean-protocol = { path = "crates/ocean-protocol" }
ocean-runtime = { path = "crates/ocean-runtime" }
ocean-mcp = { path = "crates/ocean-mcp" }
toml = "0.8"
ocean-agent-sdk = { path = "crates/ocean-agent-sdk" }
ocean-agent = { path = "crates/ocean-agent" }
ocean-providers = { path = "crates/ocean-providers" }
ocean-browser = { path = "crates/ocean-browser" }
ocean-call = { path = "crates/ocean-call" }
# Default features only ("bytes"). The `fetcher`/`rustls`/`native-tls` features
# pull in chromiumoxide_fetcher (auto-downloads Chromium) which has a broken zip
# gate in 0.9.1 — and we drive the system Chrome, so we never want the fetcher.
chromiumoxide = { version = "0.9" }
base64 = "0.22"
ocean-longhouse = { path = "crates/ocean-longhouse" }
ocean-store = { path = "crates/ocean-store" }
# Bundled SQLite (no system libsqlite3 dependency). Sync, no async-runtime
# coupling — matches the daemon's std::sync::Mutex room registry style.
rusqlite = { version = "0.32", features = ["bundled"] }
ocean-plugin = { path = "crates/ocean-plugin" }
