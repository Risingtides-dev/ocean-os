# Example folder-as-agent config. Identity comes from the folder name
# (`researcher`), never a field here. See docs/specs/folder-as-agent.md.
# Copy this folder into your agents root ($OCEAN_AGENTS_DIR, else
# <ocean-config>/agents) and the daemon will discover it: GET /v1/agents,
# then run it on a turn with the `agent` field on POST /v1/agent/turns.

# An Ocean model alias (see `GET /v1/models` / known_models). The daemon honors
# this on a turn run via this agent — fail-soft: an unresolvable model falls back
# to the global one. (eve-style gateway ids like `anthropic/claude-opus-4.8` are
# a future mapping; today use Ocean's bare aliases.)
model = "claude-opus-4-8"
description = "A careful researcher: gathers sources, verifies claims, cites."

# Tool allowlist by built-in tool name (empty = inherit all). These match the
# daemon's compiled tools — tier-0 binding, no rebuild.
tools = ["web_fetch", "read", "grep"]

# Declared capability bindings (the contract; see the spec's tier table).
# builtin:/mcp: bind against today's registry; subprocess:/wasm: are sideloaded
# without a daemon rebuild as those ocean-plugin lanes land.
capabilities = ["builtin:web_fetch", "builtin:read", "builtin:grep"]

# Tier-1 subprocess capability (A2 — shipped): a concrete, launchable spec. Each
# entry is launched per-turn as an ocean-plugin SubprocessPlugin (JSON-RPC over
# stdio) and its tools fold into the turn's registry, namespaced
# plugin__<name>__<tool> and permission-gated. `command` resolves relative to
# this folder; a spec that can't spawn is skipped (fail-soft), never breaking the
# turn. Commented out here because this example ships no binary — uncomment and
# point `command` at your plugin executable to try it.
#
# [[subprocess_capability]]
# name = "scrape"
# command = "./tools/scrape"
# args = ["--stdio"]
# cwd = "."
# env = { API_BASE = "https://example.test" }
