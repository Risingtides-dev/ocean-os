name: CI

# The Rust workspace gate. Runs on every PR and on pushes to main so a breaking
# change (including Rule-A cross-crate breaks) can't merge unchecked.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / test / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Rule A: build the WHOLE workspace, not just the daemon — a daemon-only
      # build misses cross-crate breaks.
      - name: Build (workspace)
        run: cargo build --workspace

      - name: Test (workspace)
        run: cargo test --workspace

      # Plain clippy: correctness lints that are deny-by-default still fail the
      # build, but pre-existing style warnings do not (no `-D warnings` yet).
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets

      # TODO(OCEAN-191 follow-up): add a `cargo fmt --all --check` step once a
      # one-time `cargo fmt --all` sweep is landed deliberately (~196 files —
      # separate PR, needs sign-off). The tree has never been formatted, so a fmt
      # gate would be red-on-arrival today.
      # TODO(OCEAN-191 follow-up): tighten clippy to `-- -D warnings` once the
      # tree is warning-clean (pre-existing style + await_holding_lock warnings
      # remain across several crates).
