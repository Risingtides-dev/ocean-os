name: CI

# The Rust workspace gate. Runs on every PR and on pushes to main so a breaking
# change (including Rule-A cross-crate breaks) can't merge unchecked.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / test / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Rule A: build the WHOLE workspace, not just the daemon — a daemon-only
      # build misses cross-crate breaks.
      - name: Build (workspace)
        run: cargo build --workspace

      - name: Test (workspace)
        run: cargo test --workspace

      # OCEAN-309: the tree is warning-clean — `-D warnings` keeps it that way.
      # Any new clippy warning (style or correctness, any target incl. tests)
      # fails the build instead of eroding the baseline.
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # TODO(OCEAN-191 follow-up): add a `cargo fmt --all --check` step once a
      # one-time `cargo fmt --all` sweep is landed deliberately (~196 files —
      # separate PR, needs sign-off). The tree has never been formatted, so a fmt
      # gate would be red-on-arrival today.
