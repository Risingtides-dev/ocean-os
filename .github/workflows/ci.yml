name: CI

# The Rust workspace gate. Runs on every PR and on pushes to main so a breaking
# change (including Rule-A cross-crate breaks) can't merge unchecked.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── build / test / clippy ────────────────────────────────────────────────
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS is the production deploy target; Ubuntu catches Linux-specific
        # breakage and exercises the full workspace on a second platform.
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS may need pkg-config for crate feature-detection (e.g. openssl-sys
      # probes, though the workspace pins rustls where possible). Install it
      # early so native deps can resolve headers.
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Rule A: build the WHOLE workspace, not just the daemon — a daemon-only
      # build misses cross-crate breaks.
      - name: Build (workspace)
        run: cargo build --workspace

      - name: Test (workspace)
        run: cargo test --workspace

      # OCEAN-309: the tree is warning-clean — `-D warnings` keeps it that way.
      # Any new clippy warning (style or correctness, any target incl. tests)
      # fails the build instead of eroding the baseline.
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # OCEAN-191 follow-up: the one-time fmt sweep landed in OCEAN-323.
      # The tree is now formatted — enforce it in CI.
      - name: Format check
        run: cargo fmt --all -- --check

  # ── supply-chain audit ───────────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses + advisories
        run: cargo deny check
