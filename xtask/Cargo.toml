[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# Ocean OS dev-task runner (the cargo-xtask pattern: a plain workspace binary,
# invoked via `cargo xtask <cmd>` — see /.cargo/config.toml alias). NOT part of
# the runtime; it ships nothing. Today it owns `clear-webrtc-cache`, which un-
# poisons the libwebrtc download-cache (OCEAN-252). Deliberately ZERO third-party
# deps so `cargo build --workspace` never pays for it and it can't break a build.

[[bin]]
name = "xtask"
path = "src/main.rs"
